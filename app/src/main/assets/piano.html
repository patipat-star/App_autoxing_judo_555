<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>10-Inch Tablet Piano AutoXing</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #121218; display: flex; flex-direction: column;
            align-items: center; justify-content: center; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header {
            color: #fff; margin-bottom: 12px; font-size: 20px; font-weight: bold;
            text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        /* ปรับขนาดคอนเทนเนอร์ให้พอดีกับหน้าจอ 10 นิ้วแนวตั้ง/แนวนอน */
        .piano-wrapper {
            width: 96vw; height: 80vh;
            background: #1a1a24; padding: 15px;
            border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 2px solid #333; display: flex; justify-content: center;
        }
        .piano-container {
            display: flex; position: relative;
            height: 100%; width: 100%;
        }
        /* คีย์ขาว: ปรับ flex-grow ให้ขยายเต็มความกว้างจอพอดี */
        .key {
            flex: 1; height: 100%;
            background: linear-gradient(to bottom, #fff 0%, #e6e6e6 100%);
            border: 1px solid #aaa; border-radius: 0 0 8px 8px;
            margin: 0 2px; cursor: pointer; display: flex;
            align-items: flex-end; justify-content: center;
            padding-bottom: 15px; font-weight: bold; color: #444; font-size: 13px;
            box-shadow: inset 0 -6px 0 #ccc, 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.05s ease; position: relative; z-index: 1;
        }
        .key.active {
            background: #ddd;
            box-shadow: inset 0 -2px 0 #999; transform: translateY(4px);
        }
        /* คีย์ดำ: คำนวณขนาดและตำแหน่งให้พอดีกับคีย์ขาว */
        .black-key {
            width: 3.2vw; height: 60%;
            background: linear-gradient(to bottom, #333 0%, #000 100%);
            position: absolute; border-radius: 0 0 6px 6px; z-index: 2;
            box-shadow: inset 0 -4px 0 #555, 0 4px 8px rgba(0,0,0,0.7);
            cursor: pointer;
        }
        .black-key.active {
            background: #222; box-shadow: inset 0 -1px 0 #333; transform: translateY(4px);
        }
    </style>
</head>
<body>

<div class="header">🎹 เปียโนจำลองแท็บเล็ต 10 นิ้ว (AutoXing Robot)</div>

<div class="piano-wrapper">
    <div class="piano-container" id="pianoContainer"></div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const notesMaster = [
        { name: 'C', isBlack: false },
        { name: 'C#', isBlack: true },
        { name: 'D', isBlack: false },
        { name: 'D#', isBlack: true },
        { name: 'E', isBlack: false },
        { name: 'F', isBlack: false },
        { name: 'F#', isBlack: true },
        { name: 'G', isBlack: false },
        { name: 'G#', isBlack: true },
        { name: 'A', isBlack: false },
        { name: 'A#', isBlack: true },
        { name: 'B', isBlack: false }
    ];

    function midiToFreq(midi) {
        return 440 * Math.pow(2, (midi - 69) / 12);
    }

    const container = document.getElementById('pianoContainer');

    // ตั้งค่าช่วงโน้ต 36 คีย์ (C3 ถึง B5 / MIDI 48 ถึง 83)
    const startMidi = 48;
    const endMidi = 83;
    const totalWhiteKeys = 21; // จำนวนคีย์ขาวในช่วงนี้

    let whiteKeyIndex = 0;

    // สร้างคีย์ขาวก่อนเพื่อให้โครงสร้าง Flexbox คำนวณความกว้างที่แท้จริง
    const whiteKeysMap = [];

    for (let midi = startMidi; midi <= endMidi; midi++) {
        const noteIndex = midi % 12;
        const octave = Math.floor(midi / 12) - 1;
        const noteObj = notesMaster[noteIndex];
        const noteName = noteObj.name + octave;
        const freq = midiToFreq(midi);

        if (!noteObj.isBlack) {
            const key = document.createElement('div');
            key.className = 'key';
            key.innerHTML = noteObj.name === 'C' ? noteName : '';
            key.setAttribute('data-midi', midi);

            key.addEventListener('pointerdown', (e) => { e.preventDefault(); playNote(freq, key); });
            container.appendChild(key);

            whiteKeysMap[midi] = { element: key, index: whiteKeyIndex };
            whiteKeyIndex++;
        }
    }

    // ฟังก์ชันวางตำแหน่งคีย์ดำอ้างอิงจากตำแหน่งของคีย์ขาว
    function positionBlackKeys() {
        // ลบเฉพาะคีย์ดำเก่าออกก่อนคำนวณใหม่
        const existingBlackKeys = container.querySelectorAll('.black-key');
        existingBlackKeys.forEach(k => k.remove());

        const containerWidth = container.clientWidth;
        const singleWhiteWidth = containerWidth / totalWhiteKeys;

        let currentWhiteIdx = 0;

        for (let midi = startMidi; midi <= endMidi; midi++) {
            const noteIndex = midi % 12;
            const noteObj = notesMaster[noteIndex];
            const freq = midiToFreq(midi);

            if (noteObj.isBlack) {
                const blackKey = document.createElement('div');
                blackKey.className = 'black-key';

                // จัดตำแหน่งคีย์ดำให้อยู่ตรงกลางระหว่างคีย์ขาว 2 คีย์
                const leftPos = (currentWhiteIdx * singleWhiteWidth) - (containerWidth * 0.032 / 2);
                blackKey.style.left = `${leftPos}px`;

                blackKey.addEventListener('pointerdown', (e) => { e.preventDefault(); playNote(freq, blackKey); });
                container.appendChild(blackKey);
            } else {
                currentWhiteIdx++;
            }
        }
    }

    // คำนวณตำแหน่งคีย์ดำทันที และเมื่อมีการเปลี่ยนขนาดหน้าจอ
    setTimeout(positionBlackKeys, 100);
    window.addEventListener('resize', positionBlackKeys);

    function playNote(freq, element) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 1.2);

        element.classList.add('active');
        setTimeout(() => element.classList.remove('active'), 150);
    }
</script>
</body>
</html>
