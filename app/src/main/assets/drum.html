<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Full Realistic Drum Kit</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background: #121316;
            background-image:
                linear-gradient(135deg, #1a1c23 25%, transparent 25%),
                linear-gradient(225deg, #1a1c23 25%, transparent 25%),
                linear-gradient(45deg, #1a1c23 25%, transparent 25%),
                linear-gradient(315deg, #1a1c23 25%, #0e0f12 25%);
            background-position: 10px 0, 10px 0, 0 0, 0 0;
            background-size: 20px 20px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; font-family: Arial, sans-serif;
        }

        .drum-stage {
            position: relative;
            width: min(98vw, 1280px);
            height: min(92vh, 720px);
            aspect-ratio: 16 / 9;
        }

        .pad {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            transform: translate3d(-50%, -50%, 0);
            transition: transform 0.04s ease, filter 0.04s ease;
            display: flex; align-items: center; justify-content: center;
            will-change: transform;
        }
        .pad:active, .pad.active {
            transform: translate3d(-50%, -50%, 0) scale(0.96);
            filter: brightness(1.3);
        }

        /* Styles: Cymbals */
        .cymbal {
            background: radial-gradient(circle, #fff3a1 0%, #d4a338 40%, #8a5e12 85%, #422a03 100%);
            border: 3px solid #2b1d03;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6), inset 0 0 15px rgba(255,255,255,0.4);
        }
        .cymbal::before {
            content: ''; position: absolute; width: 20%; height: 20%;
            border-radius: 50%; background: #3b2803; border: 1px solid #73500a;
        }

        .cymbal-crash { background: radial-gradient(circle, #ffe89e 0%, #c9881e 45%, #7a4f08 85%, #3d2500 100%); }
        .cymbal-splash { background: radial-gradient(circle, #fff8b3 0%, #b8a628 45%, #695d08 85%, #332d00 100%); }

        /* Styles: Drums */
        .drum {
            background: radial-gradient(circle, #2d3238 0%, #181b1e 65%, #08090a 100%);
            border: 8px solid #a3a8b0;
            box-shadow: 0 12px 25px rgba(0,0,0,0.7), inset 0 0 20px rgba(0,0,0,0.8);
        }

        .snare {
            background: radial-gradient(circle, #ffffff 0%, #dedede 60%, #999999 100%);
            border: 10px solid #c2c7ce;
        }

        .kick {
            background: radial-gradient(circle, #ffffff 0%, #e6e6e6 55%, #8c8c8c 100%);
            border: 12px solid #222;
        }

        /* Label Formatting */
        .label {
            font-weight: 900;
            font-size: clamp(10px, 1.8vw, 22px);
            color: #1d5f8a;
            text-shadow: 0 0 2px rgba(255,255,255,0.8);
            pointer-events: none;
            text-align: center;
        }
        .cymbal .label { color: #801313; }
        .splash .label { color: #116323; }
        .kick .label { color: #21629c; font-size: clamp(16px, 3vw, 36px); }
        .snare .label { color: #21629c; font-size: clamp(14px, 2.5vw, 28px); }
    </style>
</head>
<body>

<div class="drum-stage">
    <!-- Cymbals Top -->
    <div class="pad cymbal cymbal-crash" style="top:22%; left:15%; width:28%; height:50%; z-index:2;" data-sound="crash1"><span class="label">CRASH</span></div>
    <div class="pad cymbal splash" style="top:12%; left:36%; width:16%; height:28%; z-index:1;" data-sound="splash"><span class="label">SPLASH</span></div>
    <div class="pad cymbal cymbal-crash" style="top:11%; left:61%; width:24%; height:42%; z-index:1;" data-sound="crash2"><span class="label">CRASH</span></div>
    <div class="pad cymbal" style="top:21%; left:85%; width:30%; height:52%; z-index:2;" data-sound="ride"><span class="label">RIDE</span></div>

    <!-- Hi-Hats Left -->
    <div class="pad cymbal" style="top:52%; left:12%; width:20%; height:36%; z-index:3;" data-sound="closehh"><span class="label">CLOSE HH</span></div>
    <div class="pad cymbal" style="top:78%; left:8%; width:22%; height:38%; z-index:4;" data-sound="openhh"><span class="label">OPEN HH</span></div>

    <!-- Toms Upper -->
    <div class="pad drum" style="top:38%; left:32%; width:19%; height:34%; z-index:3;" data-sound="tom1"><span class="label">TOM</span></div>
    <div class="pad drum" style="top:24%; left:50%; width:20%; height:35%; z-index:2;" data-sound="tom2"><span class="label">TOM</span></div>
    <div class="pad drum" style="top:39%; left:68%; width:21%; height:37%; z-index:3;" data-sound="tom3"><span class="label">TOM</span></div>

    <!-- Center & Floor Drums -->
    <div class="pad drum snare" style="top:60%; left:50%; width:27%; height:48%; z-index:5;" data-sound="snare"><span class="label">SNARE</span></div>
    <div class="pad drum" style="top:67%; left:91%; width:25%; height:45%; z-index:4;" data-sound="floor"><span class="label">FLOOR</span></div>

    <!-- Kicks Bottom -->
    <div class="pad drum kick" style="top:81%; left:33%; width:28%; height:49%; z-index:4;" data-sound="kick"><span class="label">KICK</span></div>
    <div class="pad drum kick" style="top:81%; left:67%; width:28%; height:49%; z-index:4;" data-sound="kick"><span class="label">KICK</span></div>
</div>

<script>
    // High-Performance Audio Engine (Zero Latency)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;

        if (type === 'kick') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.exponentialRampToValueAtTime(0.001, now + 0.3);
            gain.gain.setValueAtTime(1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.3);
        }
        else if (type === 'snare') {
            const noise = audioCtx.createBufferSource();
            const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.2, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < buffer.length; i++) data[i] = Math.random() * 2 - 1;
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass'; filter.frequency.value = 800;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.7, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

            noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            noise.start(now);
        }
        else if (type.includes('tom') || type === 'floor') {
            const freqs = { tom1: 160, tom2: 130, tom3: 100, floor: 75 };
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(freqs[type] || 100, now);
            osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.4);
            gain.gain.setValueAtTime(0.8, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.4);
        }
        else { // Cymbals & HiHats
            const dur = type === 'closehh' ? 0.08 : type === 'openhh' ? 0.3 : type === 'splash' ? 0.4 : 0.8;
            const noise = audioCtx.createBufferSource();
            const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < buffer.length; i++) data[i] = Math.random() * 2 - 1;
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass'; filter.frequency.value = type.includes('hh') ? 6000 : 3500;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + dur);

            noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            noise.start(now);
        }
    }

    // Fast Touch Handling
    document.querySelectorAll('.pad').forEach(pad => {
        const trigger = (e) => {
            e.preventDefault();
            pad.classList.add('active');
            playSound(pad.dataset.sound);
            setTimeout(() => pad.classList.remove('active'), 60);
        };
        pad.addEventListener('touchstart', trigger, { passive: false });
        pad.addEventListener('mousedown', trigger);
    });
</script>
</body>
</html>
